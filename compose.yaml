
name: les

services:
  nginx:
    image: nginx:1.24.0
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: les-php:8.3.6
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      opensearch:
        condition: service_started

  db:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Required}
      MARIADB_DATABASE: mariadb
      MARIADB_USER: magento
      MARIADB_PASSWORD: ${DB_PASSWORD:?Required}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.0.15
    volumes:
      - redisdata:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearchdata:/usr/share/opensearch/data

  node:
    image: node:20.20.2
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    profiles:
      - tools
    command: ["sleep", "infinity"]

volumes:
  dbdata:
  redisdata:
  opensearchdata:
